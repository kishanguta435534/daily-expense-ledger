<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daily Expense Ledger</title><link rel="stylesheet" href="style.css"></head><body><main><header><p>PERSONAL ORGANISATION</p><h1>Daily Expense Ledger</h1><span>Keep a simple record of everyday spending.</span></header><div class="summary"><div><small>Total recorded</small><strong id="total">₹0.00</strong></div><div><small>Entries</small><strong id="count">0</strong></div></div><section><h2>Add an expense</h2><form id="form"><label>Description<input id="desc" maxlength="80" required placeholder="e.g. Notebook"></label><div class="fields"><label>Amount (₹)<input id="amount" type="number" min=".01" max="1000000" step=".01" required placeholder="120"></label><label>Category<select id="category"><option>Food</option><option>Study</option><option>Travel</option><option>Other</option></select></label></div><button>Save expense</button></form></section><section><div class="heading"><h2>Expense history</h2><select id="filter"><option>All</option><option>Food</option><option>Study</option><option>Travel</option><option>Other</option></select></div><ul id="list"></ul><p id="empty">No expenses recorded yet.</p></section><footer>Learning project • Entries stay in this browser.</footer></main><script src="app.js"></script></body></html>
